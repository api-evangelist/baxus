aid: baxus
name: Baxus
description: 'BAXUS is a peer-to-peer marketplace for buying, selling, trading, and storing fine and rare
  wine and spirits, built on the Solana blockchain. Founded in 2021 by Tzvi Wiesel and based in Woodland
  Park, New Jersey, BAXUS authenticates physical bottles and holds them in climate-controlled vaults, then
  tokenizes each as an NFT that serves as a digital certificate of ownership and provenance. Beyond the
  marketplace and Vault, BAXUS operates the BoozApp collection app, an open-source AI whiskey sommelier
  agent (BOB), and Whisky-Goggles AI bottle recognition. Its backend API at services.baxus.co powers bottle
  search, marketplace listings, and user bar collections. Backed by Multicoin Capital.'
